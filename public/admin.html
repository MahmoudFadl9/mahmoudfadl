<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة موقع محمود</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101211'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='32' font-weight='700' fill='%23b7e9d6' text-anchor='middle'%3Emf%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><style>body{max-width:1050px;margin:auto;padding:35px 5%;font-family:'Segoe UI',sans-serif}h1{font-size:32px}h2{font-size:24px}label{font-size:14px}input,textarea{background:#19231d;padding:12px;border:1px solid #ffffff30;border-radius:6px;margin-top:8px}input[type=checkbox]{display:inline-block;width:auto;margin:0 8px;accent-color:#b7e9d6}.visibility-control{display:flex;align-items:center;margin:16px 0;color:#b7e9d6}fieldset{border:1px solid #ffffff25;margin:24px 0;padding:24px;border-radius:10px}legend{padding:0 10px;color:#b7e9d6}.toolbar{position:sticky;top:0;z-index:3;background:#101211ed;backdrop-filter:blur(10px);display:flex;gap:15px;align-items:center;padding:16px 0;flex-wrap:wrap}.secondary{background:none;border:1px solid #ffffff45;border-radius:30px;padding:13px 20px}#status{color:#b7e9d6;font-size:13px}.muted{color:#a1aaa5;line-height:1.8}details{border-bottom:1px solid #ffffff25;padding:15px 0}summary{cursor:pointer}#login{max-width:450px}#editor{display:none}.project-editor{border:1px solid #ffffff25;padding:20px;margin-top:20px;border-radius:8px}</style><script type="module" src="/admin.js"></script></head><body><a href="/" target="_blank" rel="noopener">↗ معاينة الموقع</a><h1>مساحتك لإدارة المحتوى</h1><p class="muted">عدّل النصوص العربية والإنجليزية والمشاريع، ثم احفظ. تُخزَّن البيانات في <code>data/content.json</code>، ويُحفظ نسخة احتياطية تلقائيًا مع كل عملية حفظ في <code>data/backups</code>. كلمة المرور تُنشأ هنا أول مرة وتُخزَّن مشفّرة في <code>data/auth.json</code>.</p><form id="login"><h2 id="loginTitle">تسجيل الدخول</h2><label>كلمة المرور (12 حرفًا على الأقل)<input id="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password"></label><button class="pill">متابعة</button></form><p id="status" role="status" aria-live="polite"></p><form id="editor"><div class="toolbar"><button class="pill" type="submit">حفظ التعديلات</button><button class="secondary" id="export" type="button">تنزيل نسخة من المحتوى</button><button class="secondary" id="logout" type="button">خروج</button></div><div id="fields"></div></form></body></html>
